[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcgem-student"
version = "0.1.0"
description = "Standalone DFT-free 3D molecular representation and calibrated quantum-chemical predictor for qcGEM (external weights required)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "rdkit>=2023.9",
    "torch-geometric>=2.4",
]

[project.urls]
Homepage = "https://github.com/GHUSER-haoyu/qcGEM"
Releases = "https://github.com/GHUSER-haoyu/qcGEM/releases/tag/v0.1.0"

[project.scripts]
qcgem-embed = "qcgem_student.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
